<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leitner System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Leitner System</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <button id="logout-btn" class="btn btn-outline-light">Logout</button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div id="main-container" style="display: none; padding-top: 56px;">
      <div class="container-fluid">
        <div class="row">
          <!-- Sidebar -->
          <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
            <div class="position-sticky pt-3">
              <ul class="nav flex-column">
                <li class="nav-item">
                  <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-muted">
                    <span>Actions</span>
                  </h6>
                  <ul class="nav flex-column mb-2">
                    <li class="nav-item">
                      <button id="open-create-card-modal" class="btn btn-primary w-100 mb-2" data-bs-toggle="modal" data-bs-target="#create-card-modal">Create New Card</button>
                    </li>
                    <li class="nav-item">
                      <button id="open-manage-subjects-modal" class="btn btn-secondary w-100 mb-2" data-bs-toggle="modal" data-bs-target="#manage-subjects-modal">Manage Subjects</button>
                    </li>
                    <li class="nav-item">
                      <button id="open-manage-tags-modal" class="btn btn-secondary w-100" data-bs-toggle="modal" data-bs-target="#manage-tags-modal">Manage Tags</button>
                    </li>
                  </ul>
                </li>
                <li class="nav-item">
                  <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-muted">
                    <span>Filter by Subject</span>
                  </h6>
                  <div id="filter-subjects-area" class="px-3">
                    <select id="subject-filter" class="form-select">
                      <option value="">All Subjects</option>
                    </select>
                  </div>
                </li>
                <li class="nav-item">
                  <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-muted">
                    <span>Filter by Tags</span>
                  </h6>
                  <div id="filter-tags-area" class="px-3">
                    <div id="tag-filters"></div>
                  </div>
                </li>
              </ul>
            </div>
          </nav>

          <!-- Main content -->
          <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div id="leitner-container" class="leitner-container pt-3 pb-2 mb-3">
              <!-- Boxes will be dynamically inserted here -->
            </div>
            <div id="card-staging-area" class="card-staging-area">
              <h2>Review Area</h2>
              <div id="card-to-review" class="card-to-review">
                <!-- The current card for review will be placed here -->
              </div>
              <div class="review-buttons mt-3">
                <button id="correct-btn" class="btn btn-success">Correct</button>
                <button id="incorrect-btn" class="btn btn-danger">Incorrect</button>
              </div>
            </div>
          </main>
        </div>
      </div>
    </div>

    <!-- Modals -->
    <div class="modal fade" id="create-card-modal" tabindex="-1" aria-labelledby="createCardModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="createCardModalLabel">Create New Card</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="create-card-form">
              <div class="mb-3">
                <textarea id="card-front" class="form-control" placeholder="Front of card (Question)" required></textarea>
              </div>
              <div class="mb-3">
                <textarea id="card-back" class="form-control" placeholder="Back of card (Answer)" required></textarea>
              </div>
              <div class="mb-3" id="card-subject-selector"></div>
              <div class="mb-3" id="card-tags"></div>
              <div id="create-card-color-selector" class="color-selector-tray mb-3"></div>
              <button type="submit" class="btn btn-primary">Create Card</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="manage-tags-modal" tabindex="-1" aria-labelledby="manageTagsModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="manageTagsModalLabel">Manage Tags</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="create-tag-form" class="mb-3">
              <div class="input-group">
                <input type="text" id="tag-name" class="form-control" placeholder="New tag name" required />
                <button type="submit" class="btn btn-primary">Create Tag</button>
              </div>
            </form>
            <ul id="tags-list" class="list-group"></ul>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="manage-subjects-modal" tabindex="-1" aria-labelledby="manageSubjectsModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="manageSubjectsModalLabel">Manage Subjects</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="create-subject-form" class="mb-3">
              <div class="input-group">
                <input type="text" id="subject-name" class="form-control" placeholder="New subject name" required />
                <button type="submit" class="btn btn-primary">Create Subject</button>
              </div>
            </form>
            <ul id="subjects-list" class="list-group"></ul>
          </div>
        </div>
      </div>
    </div>

    <script src="constants.js"></script>
    <script src="auth.js"></script>
    <script src="frontend.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        if (window.auth && window.auth.getToken()) {
          document.getElementById('main-container').style.display = 'block';
        }
        const logoutBtn = document.getElementById('logout-btn');
        if(logoutBtn) {
            logoutBtn.addEventListener('click', () => {
                if(window.auth) {
                    window.auth.logout();
                }
            });
        }
      });
    </script>
  </body>
</html>
