<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Leitner System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="dark-mode-toggle-auth" class="dark-mode-toggle-auth">🌙</div>
    <div class="auth-container">
      <div class="welcome-hero">
        <h1>Master any subject with smarter study sessions</h1>
        <p class="lead">Learn efficiently using the Leitner spaced repetition system</p>
        <p class="text-muted">Cards you know move forward, cards you miss come back for review. Study less, remember more.</p>
      </div>
      <div class="auth-form">
        <h1 class="mb-4">Login</h1>
        <form id="login-form">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" name="email" class="form-control" required />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
              <input type="password" id="password" name="password" class="form-control" required />
              <button type="button" id="toggle-password" class="btn btn-outline-secondary" tabindex="-1">
                <i class="bi bi-eye" id="toggle-password-icon"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <p class="auth-switch mt-4 text-center">
          Don't have an account? <a href="/register.html">Register here</a>
        </p>
        <div id="error-message" class="alert alert-danger mt-3" role="alert" style="display: none;"></div>
      </div>
    </div>
    <script type="module" src="./auth.js"></script>
    <script>
      document.getElementById('toggle-password').addEventListener('click', function () {
        const input = document.getElementById('password');
        const icon = document.getElementById('toggle-password-icon');
        if (input.type === 'password') {
          input.type = 'text';
          icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
          input.type = 'password';
          icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
      });
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
